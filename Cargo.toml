[workspace]
resolver = "3"
members = ["crates/ipc", "crates/daemon", "crates/ctl", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
swarm-ipc = { path = "crates/ipc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
anyhow = "1"
libc = "0.2"
